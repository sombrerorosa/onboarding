<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sombrero Rosa — Cuestionario de Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Sombrero Rosa — Design System tokens (alineado a
     Sombrero_Rosa_-_Design_System.html)
     ============================================================ */
  :root{
    --rosa:#d5848e;
    --rosa-50:#fbf0f1; --rosa-100:#f5dadd; --rosa-200:#ecbbc1; --rosa-300:#df9ba3;
    --rosa-400:#d5848e; --rosa-500:#c66773; --rosa-600:#ae4f5b; --rosa-700:#8c3d47;
    --hot:#e55a7a; --hot-soft:#f7c2cf;
    --navy:#193149; --navy-700:#112338; --navy-800:#0b1a2a;
    --ink:#403f3f; --ink-soft:#6b6968;
    --bone:#f2f2f0; --bone-2:#e9e8e3;
    --paper:#fafafa; --black:#020202; --black-2:#0b0b0b; --white:#ffffff;

    --border: rgba(25,49,73,.10);
    --border-strong: rgba(25,49,73,.22);
    --border-on-dark: rgba(242,242,240,.16);

    --font-sans:'Poppins', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif;

    --fs-h1: clamp(28px, 3.8vw, 44px);
    --fs-qnum: clamp(64px, 9vw, 120px);
    --fs-lead: 18px;
    --fs-body: 16px;
    --fs-small: 14px;
    --fs-eyebrow: 12px;

    --tr-tight:-0.02em;
    --tr-snug:-0.01em;
    --tr-eyebrow:0.16em;

    --r-xs:4px; --r-sm:8px; --r-md:14px; --r-lg:22px; --r-xl:32px; --r-pill:999px;

    --shadow-sm: 0 2px 6px rgba(25,49,73,.08);
    --shadow-md: 0 12px 28px -10px rgba(25,49,73,.18);
    --shadow-rosa: 0 18px 40px -16px rgba(213,132,142,.55);

    --ease-out: cubic-bezier(0.22,1,0.36,1);
    --dur-2:200ms; --dur-3:320ms;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-sans);
    background:var(--black);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{position:relative;width:100vw;height:100vh;}

  .section{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8vh 8vw;
    opacity:0;
    pointer-events:none;
    transform:translateY(24px);
    transition:opacity .55s var(--ease-out), transform .55s var(--ease-out);
  }
  .section.active{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }
  .section.dark{ background:var(--black); color:var(--bone); }
  .section.light{ background:var(--bone); color:var(--ink); }

  .inner{ max-width:720px; width:100%; position:relative; }

  .eyebrow{
    font-size:var(--fs-eyebrow);
    font-weight:600;
    letter-spacing:var(--tr-eyebrow);
    text-transform:uppercase;
    color:var(--rosa-600);
    margin-bottom:22px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .dark .eyebrow{ color:var(--rosa-300); }
  .eyebrow .line{ height:1px; width:32px; background:currentColor; opacity:.5; }

  .qnum{
    font-family:var(--font-sans);
    font-weight:300;
    font-size:var(--fs-qnum);
    line-height:.8;
    position:absolute;
    top:-30px;
    right:0;
    opacity:.06;
    user-select:none;
    letter-spacing:var(--tr-tight);
  }
  .dark .qnum{ color:var(--bone); }
  .light .qnum{ color:var(--navy); }

  h1.question{
    font-family:var(--font-sans);
    font-weight:700;
    font-size:var(--fs-h1);
    line-height:1.18;
    letter-spacing:var(--tr-snug);
    max-width:16ch;
    margin-bottom:16px;
    color:var(--navy);
  }
  .dark h1.question{ color:var(--bone); }

  .context{
    font-family:var(--font-sans);
    font-weight:400;
    font-size:var(--fs-lead);
    line-height:1.55;
    max-width:56ch;
    margin-bottom:32px;
    color:var(--ink-soft);
  }
  .dark .context{ color:rgba(242,242,240,.72); }

  .answerzone{ min-height:90px; }

  textarea.answer{
    width:100%;
    min-height:110px;
    resize:vertical;
    background:var(--white);
    border:1px solid var(--border-strong);
    border-radius:var(--r-md);
    outline:none;
    font-family:var(--font-sans);
    font-size:var(--fs-body);
    line-height:1.55;
    color:var(--navy);
    padding:14px 16px;
    transition:border var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
  }
  textarea.answer:focus{ border:1.5px solid var(--rosa); box-shadow:0 0 0 4px var(--rosa-100); }
  textarea.answer::placeholder{ color:var(--ink-soft); font-size:var(--fs-small); }

  /* cover */
  #cover{ background:var(--black); color:var(--bone); text-align:center; flex-direction:column; }
  .kicker{ font-size:var(--fs-eyebrow); font-weight:600; letter-spacing:var(--tr-eyebrow); text-transform:uppercase; color:var(--rosa-300); margin-bottom:24px;}
  #cover h1{
    font-family:var(--font-sans);
    font-weight:700;
    letter-spacing:var(--tr-tight);
    font-size:clamp(34px,5.6vw,58px);
    line-height:1.08;
    margin-bottom:18px;
    color:var(--bone);
  }
  #cover .client{
    font-size:15px;
    letter-spacing:.02em;
    color:var(--rosa-300);
    margin-bottom:32px;
    font-weight:600;
  }
  #cover p.desc{
    max-width:520px;
    font-size:var(--fs-body);
    line-height:1.7;
    color:rgba(242,242,240,.75);
    margin-bottom:40px;
  }

  /* buttons — .btn-primary del design system */
  button.btn{
    font-family:var(--font-sans); font-weight:600; font-size:15px;
    padding:14px 26px; border-radius:var(--r-md); border:none;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    background:var(--hot); color:var(--white);
    transition:transform var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out);
  }
  button.btn:hover{ background:var(--rosa-600); transform:translateY(-2px); box-shadow:var(--shadow-rosa); }
  button.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
  button.btn:disabled:hover{ background:var(--hot); }
  .startbtn::after{ content:"→"; }

  /* contact step */
  .field{ margin-bottom:20px; text-align:left; }
  .field label{
    display:block;
    font-size:14px;
    font-weight:500;
    color:var(--rosa-300);
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    height:48px;
    background:var(--white);
    border:1px solid var(--border-strong);
    border-radius:var(--r-md);
    outline:none;
    font-family:var(--font-sans);
    font-size:15px;
    color:var(--navy);
    padding:0 14px;
    transition:border var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
  }
  .field input::placeholder{ color:var(--ink-soft); }
  .field input:focus{ border:1.5px solid var(--rosa); box-shadow:0 0 0 4px var(--rosa-100); }
  .fieldgrid{ display:grid; grid-template-columns:1fr 1fr; gap:0 24px; }
  .fielderr{ font-size:13px; color:var(--hot); margin-top:6px; min-height:16px; }
  #contactStep .inner{ text-align:left; }
  #contactStep h1{
    font-family:var(--font-sans);
    font-weight:700;
    letter-spacing:var(--tr-snug);
    font-size:clamp(26px,4vw,38px);
    margin-bottom:14px;
    color:var(--bone);
  }
  #contactStep .lead{
    font-size:15px;
    line-height:1.6;
    color:rgba(242,242,240,.72);
    margin-bottom:36px;
    max-width:52ch;
  }

  /* closing */
  #closing{ background:var(--navy); color:var(--bone); text-align:center; flex-direction:column; }
  #closing h1{
    font-family:var(--font-sans);
    font-weight:700;
    letter-spacing:var(--tr-tight);
    font-size:clamp(28px,4.6vw,44px);
    margin-bottom:18px;
    color:var(--bone);
  }
  #closing p{ max-width:480px; font-size:15px; line-height:1.7; color:rgba(242,242,240,.75); margin-bottom:8px;}
  #sendBtn{ margin-top:24px; }
  #sendStatus{ margin-top:16px; font-size:13px; letter-spacing:.02em; min-height:20px; }
  #sendStatus.ok{ color:#8FBF9F; }
  #sendStatus.err{ color:var(--hot); }

  /* nav + progress */
  #chrome{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6vw 4vh 6vw;
    z-index:50;
    pointer-events:none;
  }
  .navbtn{
    pointer-events:auto;
    background:none;
    border:1.5px solid var(--border-on-dark);
    color:var(--bone);
    width:44px;height:44px;
    border-radius:var(--r-pill);
    cursor:pointer;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    transition:all var(--dur-2) var(--ease-out);
    font-family:var(--font-sans);
  }
  .navbtn:hover{ border-color:var(--rosa); color:var(--rosa-300); }
  .navbtn:disabled{ opacity:.15; cursor:default; }
  .navbtn:disabled:hover{ border-color:var(--border-on-dark); color:var(--bone); }

  #progressWrap{
    position:fixed;
    top:0;left:0;right:0;
    height:2px;
    background:rgba(255,255,255,.08);
    z-index:60;
  }
  #progressBar{
    height:100%;
    width:0%;
    background:var(--hot);
    transition:width .5s var(--ease-out);
  }
  #stepLabel{
    position:fixed;
    top:20px; right:6vw;
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--rosa-300);
    z-index:60;
  }
  #logoFixed{
    position:fixed;
    top:18px; left:6vw;
    font-family:var(--font-sans);
    font-weight:700;
    font-size:15px;
    letter-spacing:var(--tr-snug);
    color:var(--bone);
    z-index:60;
  }
  #logoFixed em{ font-style:italic; font-weight:600; color:var(--rosa-300); }

  footer.foot{
    position:absolute;
    bottom:26px;
    left:0;right:0;
    text-align:center;
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(242,242,240,.35);
  }
  .light footer.foot{ color:var(--ink-soft); opacity:.6; }

  @media (max-width:640px){
    .section{ padding:9vh 6vw 14vh 6vw; }
    .qnum{ font-size:52px; top:-22px;}
    #chrome{ padding:0 6vw 3vh 6vw; }
    .fieldgrid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div id="progressWrap"><div id="progressBar"></div></div>
<div id="logoFixed">Sombrero <em>Rosa</em></div>
<div id="stepLabel"></div>

<div id="app"></div>

<div id="chrome">
  <button class="navbtn" id="prevBtn" aria-label="Anterior">←</button>
  <button class="navbtn" id="nextBtn" aria-label="Siguiente">→</button>
</div>

<script>
/* ============================================================
   CONFIG — HubSpot Forms API
   Reemplazar HUBSPOT_FORM_GUID por el guid del form que crees
   en HubSpot (Marketing > Forms) con estos campos internos:
   firstname, lastname, email, phone, company, message
   ============================================================ */
const HUBSPOT_CONFIG = {
  portalId: "49258509",
  formGuid: "c58deb6c-93ea-4146-b632-3a396983e3a3", // Form Sombrero Home
  pageUrl: window.location.href,
  pageName: "Briefing Aluminio Buenos Aires"
};

const questions = [
  {
    mod:"NÚCLEO", theme:"dark",
    q:"¿A quién le habla tu marca?",
    ctx:"Pensá en la persona real que atiende el teléfono, no en un cliente ideal de manual: ¿es un carpintero que llama urgido, un distribuidor que compra por volumen, alguien que arma su propia cortina?"
  },
  {
    mod:"NAMING", theme:"light",
    q:"¿Qué valores tiene que transmitir el nombre en el primer contacto?",
    ctx:"Antes de que alguien sepa qué hacen, el nombre ya dice algo. ¿Qué querés que diga en ese primer segundo?"
  },
  {
    mod:"NÚCLEO", theme:"dark",
    q:"¿Qué problema concreto resuelve tu marca en la vida de esa persona?",
    ctx:""
  },
  {
    mod:"NAMING", theme:"light",
    q:"¿Preferís sonidos suaves, contundentes, extranjeros o inventados?",
    ctx:"No hace falta que sepas la respuesta técnica. Pensá en voz alta: si tuvieras que gritar el nombre en un galpón, ¿cómo suena?"
  },
  {
    mod:"ESTRATEGIA", theme:"dark",
    q:"¿Cuál es la promesa central de tu marca — lo que prometés siempre, pase lo que pase?",
    ctx:""
  },
  {
    mod:"NAMING", theme:"light",
    q:"¿Hay nombres que admirés, de cualquier rubro, y por qué?",
    ctx:"Pueden ser marcas de aluminio, de autos, de indumentaria — lo que te guste. Nos interesa el por qué, no el qué."
  },
  {
    mod:"NÚCLEO", theme:"dark",
    q:"¿Qué NO querés que se diga, sienta o asocie con tu marca bajo ningún punto de vista?",
    ctx:""
  },
  {
    mod:"IDENTIDAD VISUAL", theme:"light",
    q:"¿Hay referencias visuales que te gusten, aunque no sean de tu rubro?",
    ctx:"Marcas, artistas, arquitectura, autos, lo que sea. Mandanos fotos si tenés, acá simplemente contanos qué te atrae de esas referencias."
  },
  {
    mod:"ESTRATEGIA", theme:"dark",
    q:"¿Qué querés que sienta alguien cuando termina de interactuar con vos?",
    ctx:""
  },
  {
    mod:"IDENTIDAD VISUAL", theme:"light",
    q:"¿Hay colores que definitivamente no van con vos, y por qué?",
    ctx:""
  },
  {
    mod:"NÚCLEO", theme:"dark",
    q:"¿Cómo te imaginás tu marca dentro de 3 años?",
    ctx:"Con las máquinas nuevas de pintura ya funcionando, con la distribución nacional consolidada — ¿cómo se ve y qué hace esa empresa?"
  },
  {
    mod:"IDENTIDAD VISUAL", theme:"light",
    q:"¿Cómo describirías tu marca si fuera una persona: cómo se viste, cómo habla, a dónde va?",
    ctx:""
  },
  {
    mod:"NÚCLEO", theme:"dark",
    q:"¿Qué deseás vos, personalmente, de tu marca?",
    ctx:"Distinto a lo anterior — no qué le da al cliente, sino qué te gustaría que te dé a vos."
  },
  {
    mod:"CIERRE", theme:"light",
    q:"¿Hay algo que no te preguntamos y que sentís que es importante que sepamos?",
    ctx:""
  },
  {
    mod:"CIERRE", theme:"dark",
    q:"¿Cómo preferís que nos comuniquemos con vos durante el proceso?",
    ctx:"WhatsApp, mail, llamadas — lo que te resulte más cómodo."
  },
];

// current: -2 = cover, -1 = contact step, 0..N-1 = questions, N = closing
let current = -2;
const totalSteps = questions.length + 3; // cover + contact + questions + closing
const app = document.getElementById('app');

function buildCover(){
  const el = document.createElement('div');
  el.id = 'cover';
  el.className = 'section active';
  el.innerHTML = `
    <div class="kicker">Sombrero Rosa · Estudio de marca</div>
    <h1>Cuestionario de Briefing</h1>
    <div class="client">Rebranding — Aluminio Buenos Aires · San Justo, Buenos Aires</div>
    <p class="desc">Este cuestionario es el primer paso de nuestro proceso juntos. No hay respuestas correctas ni incorrectas — nos interesa entender cómo pensás vos sobre tu marca, no cómo creés que deberías pensar. Respondé con lo primero que te venga, sin filtros.</p>
    <button class="btn startbtn" id="startBtn">Comenzar</button>
    <footer class="foot">Naming · Estrategia de marca · Identidad visual</footer>
  `;
  return el;
}

function buildContactStep(){
  const el = document.createElement('div');
  el.id = 'contactStep';
  el.className = 'section dark';
  el.innerHTML = `
    <div class="inner">
      <div class="eyebrow"><span class="line"></span>ANTES DE EMPEZAR</div>
      <h1>Contanos quién sos</h1>
      <p class="lead">Estos datos nos sirven para identificar el brief y volver a contactarte por el proceso de naming e identidad.</p>
      <div class="fieldgrid">
        <div class="field">
          <label for="f_firstname">Nombre *</label>
          <input type="text" id="f_firstname" placeholder="Tu nombre" autocomplete="given-name">
        </div>
        <div class="field">
          <label for="f_lastname">Apellido *</label>
          <input type="text" id="f_lastname" placeholder="Tu apellido" autocomplete="family-name">
        </div>
      </div>
      <div class="fieldgrid">
        <div class="field">
          <label for="f_email">Email *</label>
          <input type="email" id="f_email" placeholder="nombre@empresa.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="f_phone">Teléfono</label>
          <input type="tel" id="f_phone" placeholder="+54 9 11 ..." autocomplete="tel">
        </div>
      </div>
      <div class="field">
        <label for="f_company">Empresa *</label>
        <input type="text" id="f_company" placeholder="Aluminio Buenos Aires" autocomplete="organization" value="Aluminio Buenos Aires">
      </div>
      <div class="fielderr" id="contactErr"></div>
    </div>
  `;
  return el;
}

function buildClosing(){
  const el = document.createElement('div');
  el.id = 'closing';
  el.className = 'section';
  el.innerHTML = `
    <div class="kicker">Gracias</div>
    <h1>Esto ya es un buen comienzo.</h1>
    <p>Con esto empezamos a construir el terreno para el nombre y la identidad que van a acompañar el crecimiento de Aluminio Buenos Aires.</p>
    <p>Nos vemos pronto para conversar sobre todo esto en profundidad.</p>
    <button class="btn" id="sendBtn">Enviar respuestas</button>
    <div id="sendStatus"></div>
    <footer class="foot">Sombrero Rosa · Rebranding · 2026</footer>
  `;
  return el;
}

function buildQuestion(item, index){
  const el = document.createElement('div');
  el.className = 'section ' + item.theme;
  el.innerHTML = `
    <div class="inner">
      <div class="qnum">${String(index+1).padStart(2,'0')}</div>
      <div class="eyebrow"><span class="line"></span>${item.mod}</div>
      <h1 class="question">${item.q}</h1>
      ${item.ctx ? `<div class="context">${item.ctx}</div>` : ''}
      <div class="answerzone">
        <textarea class="answer" data-qindex="${index}" placeholder="Escribí tu respuesta acá (opcional para esta vista de presentación)"></textarea>
      </div>
    </div>
  `;
  return el;
}

// build all sections once
const sections = [];
sections.push(buildCover());
sections.push(buildContactStep());
questions.forEach((q,i)=> sections.push(buildQuestion(q,i)) );
sections.push(buildClosing());
sections.forEach(s=>app.appendChild(s));

function sectionIndexFromCurrent(){
  // maps current (-2..questions.length) to sections[] index (0..totalSteps-1)
  return current + 2;
}

function render(){
  const idx = sectionIndexFromCurrent();
  sections.forEach((s,i)=>{
    s.classList.toggle('active', i === idx);
  });
  const pct = (idx / (totalSteps-1)) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('stepLabel').textContent =
    idx === 0 ? '' : idx === totalSteps-1 ? 'Fin' : idx === 1 ? 'Datos' : `${idx-1} / ${questions.length}`;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === totalSteps-1;
}

function contactIsValid(){
  const fn = document.getElementById('f_firstname')?.value.trim();
  const ln = document.getElementById('f_lastname')?.value.trim();
  const em = document.getElementById('f_email')?.value.trim();
  const co = document.getElementById('f_company')?.value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em || '');
  return !!(fn && ln && emailOk && co);
}

function go(delta){
  // block leaving the contact step (moving forward) until it's valid
  if(current === -1 && delta > 0 && !contactIsValid()){
    document.getElementById('contactErr').textContent = 'Completá nombre, apellido, email y empresa para continuar.';
    return;
  }
  const next = current + delta;
  if(next < -2 || next > questions.length) return;
  current = next;
  render();
}

document.getElementById('nextBtn').addEventListener('click', ()=>go(1));
document.getElementById('prevBtn').addEventListener('click', ()=>go(-1));
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
});
document.addEventListener('click', (e)=>{
  if(e.target && e.target.id === 'startBtn'){ go(1); }
  if(e.target && e.target.id === 'sendBtn'){ submitBrief(); }
});

/* ============================================================
   Envío a HubSpot — Forms API (submission pública, sin token
   expuesto del lado del cliente).
   Endpoint: https://api.hsforms.com/submissions/v3/integration/submit/{portalId}/{formGuid}
   ============================================================ */
async function submitBrief(){
  const statusEl = document.getElementById('sendStatus');
  const sendBtn = document.getElementById('sendBtn');

  if(HUBSPOT_CONFIG.formGuid === "REEMPLAZAR_CON_FORM_GUID"){
    statusEl.className = 'err';
    statusEl.textContent = 'Falta configurar el formGuid de HubSpot en el código (ver comentario CONFIG al inicio del script).';
    return;
  }

  // Arma el contenido del brief como texto legible para el campo "message"
  const briefText = questions.map((q, i) => {
    const ta = document.querySelector(`textarea[data-qindex="${i}"]`);
    const answer = ta ? ta.value.trim() : '';
    return `${String(i+1).padStart(2,'0')}. ${q.q}\n${answer || '(sin responder)'}`;
  }).join('\n\n');

  const payload = {
    fields: [
      { objectTypeId: "0-1", name: "firstname", value: document.getElementById('f_firstname').value.trim() },
      { objectTypeId: "0-1", name: "lastname", value: document.getElementById('f_lastname').value.trim() },
      { objectTypeId: "0-1", name: "email", value: document.getElementById('f_email').value.trim() },
      { objectTypeId: "0-1", name: "hs_whatsapp_phone_number", value: document.getElementById('f_phone').value.trim() },
      { objectTypeId: "0-1", name: "company", value: document.getElementById('f_company').value.trim() },
      { objectTypeId: "0-1", name: "message", value: briefText }
    ],
    context: {
      pageUri: HUBSPOT_CONFIG.pageUrl,
      pageName: HUBSPOT_CONFIG.pageName
    }
  };

  sendBtn.disabled = true;
  sendBtn.textContent = 'Enviando...';
  statusEl.className = '';
  statusEl.textContent = '';

  try {
    const res = await fetch(
      `https://api.hsforms.com/submissions/v3/integration/submit/${HUBSPOT_CONFIG.portalId}/${HUBSPOT_CONFIG.formGuid}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }
    );

    if(!res.ok){
      const errBody = await res.text();
      throw new Error(`HubSpot ${res.status}: ${errBody}`);
    }

    statusEl.className = 'ok';
    statusEl.textContent = '¡Recibido! Gracias por completar el brief.';
    sendBtn.textContent = 'Enviado ✓';
  } catch(err){
    statusEl.className = 'err';
    statusEl.textContent = 'Hubo un problema al enviar. Probá de nuevo en unos segundos.';
    sendBtn.disabled = false;
    sendBtn.textContent = 'Enviar respuestas';
    console.error(err);
  }
}

render();
</script>
</body>
</html>
